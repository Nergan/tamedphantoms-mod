# neoforge.mods.toml
# Значения вида ${...} подставляются Gradle-задачей generateModMetadata.

license = "${mod_license}"
issueTrackerURL = "https://github.com/Nergan/tamedphantoms-mod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
displayURL = "https://github.com/Nergan/tamedphantoms-mod"
authors = "${mod_authors}"
description = '''
${mod_description}

Taming phantoms (the taming item is configurable — cookie by default),
saddle flight, owner defense, repelling wild phantoms, and more.
Приручение фантомов (предмет для приручения настраивается — по умолчанию
печенье), полёт на седле, защита владельца, отпугивание диких фантомов
и многое другое.
'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "kotlinforforge"
type = "required"
versionRange = "${kff_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "patchouli"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"
