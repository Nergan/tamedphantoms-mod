# Keeps the daemon small enough to configure both loaders on a 7 GB machine.
# Serial GC avoids the large native reservation that G1 makes on that machine.
org.gradle.jvmargs=-Xmx768m -XX:+UseSerialGC
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official

minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.76
loader_version_range=[12,)
kotlin_version=2.4.0
kff_version=6.4.0
kff_version_range=[6.4,)

fabric_loader_version=0.19.5
fabric_api_version=0.162.0+26.3
fabric_kotlin_version=1.14.2+kotlin.2.4.21
cloth_config_version=26.3.159
cloth_config_modrinth_version=26.3.159
modmenu_version=21.0.0
placeholder_api_version=3.2.0+26.3
