# ============================================================
# Настройки Gradle
# ============================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Параметр Kotlin-плагина: не показывать предупреждение о том,
# что используется официальный "IR"-бэкенд (он и так единственный с Kotlin 1.5+).
kotlin.code.style=official

# ============================================================
# Parchment-маппинги (человекочитаемые имена параметров/javadoc).
# Список версий: https://parchmentmc.org/docs/getting-started
# ============================================================
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ============================================================
# Minecraft / NeoForge
# Актуальные версии NeoForge: https://projects.neoforged.net/neoforged/neoforge
# Версия Minecraft и версия NeoForge должны соответствовать друг другу.
# ============================================================
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.209
# Диапазон версий загрузчика FML (не версии NeoForge!) — оставляем как в официальном MDK.
loader_version_range=[1,)

# ============================================================
# Kotlin for Forge (KFF) — https://modrinth.com/mod/kotlin-for-forge
# Обязательно используем артефакт "kotlinforforge-neoforge" (не "kotlinforforge").
# ============================================================
kotlin_version=2.1.20
kff_version=5.8.0
# Диапазон версии KFF, который мы требуем в neoforge.mods.toml
kff_version_range=[5.8,)

# ============================================================
# Метаданные мода
# ============================================================
mod_id=tamedphantoms
mod_name=Tamed Phantoms
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.tamedphantoms.mod
mod_authors=Tamed Phantoms contributors
mod_description=Tame phantoms: taming, saddle flight, and more.
