name: Release

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

# Пуш в main (и тег v<mod_version> / ручной запуск) пересобирает 1.21.1 и 26.3
# и обновляет четыре страницы GitHub Release: версия Minecraft и загрузчик.
# Patchouli только на страницах 1.21.1. CDN публикует только NeoForge 1.21.1.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read versions from gradle.properties
        id: versions
        run: |
          set -euo pipefail
          mod_version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          kff_version="$(grep -E '^kff_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          patchouli_version="$(grep -E '^patchouli_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          fabric_api_version="$(grep -E '^fabric_api_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          fabric_kotlin_version="$(grep -E '^fabric_kotlin_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          patchouli_fabric_version="$(grep -E '^patchouli_fabric_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          cloth_config_modrinth_version="$(grep -E '^cloth_config_modrinth_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          modmenu_version="$(grep -E '^modmenu_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          placeholder_api_version="$(grep -E '^placeholder_api_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          echo "mod_version=${mod_version}" >> "$GITHUB_OUTPUT"
          echo "kff_version=${kff_version}" >> "$GITHUB_OUTPUT"
          echo "patchouli_version=${patchouli_version}" >> "$GITHUB_OUTPUT"
          echo "fabric_api_version=${fabric_api_version}" >> "$GITHUB_OUTPUT"
          echo "fabric_kotlin_version=${fabric_kotlin_version}" >> "$GITHUB_OUTPUT"
          echo "patchouli_fabric_version=${patchouli_fabric_version}" >> "$GITHUB_OUTPUT"
          echo "cloth_config_modrinth_version=${cloth_config_modrinth_version}" >> "$GITHUB_OUTPUT"
          echo "modmenu_version=${modmenu_version}" >> "$GITHUB_OUTPUT"
          echo "placeholder_api_version=${placeholder_api_version}" >> "$GITHUB_OUTPUT"
          echo "mod_version=${mod_version}" >> "$GITHUB_ENV"

      - name: Check tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          expected="v${{ steps.versions.outputs.mod_version }}"
          actual="${GITHUB_REF_NAME}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Tag ${actual} must be ${expected} (mod_version in gradle.properties)."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build and test
        run: gradle build --stacktrace

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          # services.gradle.org publishes 9.7.0, not the short form 9.7.
          gradle-version: "9.7.0"

      - name: Build 26.3
        working-directory: versions/26.3
        run: gradle build --stacktrace

      - name: Collect release jars
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          jars=(build/libs/tamedphantoms-*.jar)
          if [[ ${#jars[@]} -eq 0 ]]; then
            echo "No tamedphantoms jar in build/libs"
            exit 1
          fi
          for jar in "${jars[@]}"; do
            case "${jar}" in
              *-sources.jar|*-javadoc.jar) continue ;;
              *) cp -v "${jar}" release-assets/ ;;
            esac
          done
          test -f "release-assets/tamedphantoms-neoforge-1.21.1-${{ steps.versions.outputs.mod_version }}.jar"
          fabric_jars=(fabric/build/libs/tamedphantoms-fabric-*.jar)
          if [[ ${#fabric_jars[@]} -eq 0 ]]; then
            echo "No Fabric jar in fabric/build/libs"
            exit 1
          fi
          for jar in "${fabric_jars[@]}"; do
            case "${jar}" in
              *-sources.jar|*-dev.jar) continue ;;
              *) cp -v "${jar}" release-assets/ ;;
            esac
          done
          test -f "release-assets/tamedphantoms-fabric-1.21.1-${{ steps.versions.outputs.mod_version }}.jar"
          chmod +x .github/scripts/fetch-companion-jars.sh
          .github/scripts/fetch-companion-jars.sh \
            release-assets \
            "${{ steps.versions.outputs.kff_version }}" \
            "${{ steps.versions.outputs.patchouli_version }}" \
            "${{ steps.versions.outputs.fabric_api_version }}" \
            "${{ steps.versions.outputs.fabric_kotlin_version }}" \
            "${{ steps.versions.outputs.patchouli_fabric_version }}" \
            "${{ steps.versions.outputs.cloth_config_modrinth_version }}" \
            "${{ steps.versions.outputs.modmenu_version }}" \
            "${{ steps.versions.outputs.placeholder_api_version }}"
          shopt -s nullglob
          neo26=(versions/26.3/build/libs/tamedphantoms-neoforge-26.3-*.jar)
          fabric26=(versions/26.3/fabric/build/libs/tamedphantoms-fabric-26.3-*.jar)
          if [[ ${#neo26[@]} -ne 1 || ${#fabric26[@]} -ne 1 ]]; then
            echo "Expected one NeoForge and one Fabric 26.3 jar"
            exit 1
          fi
          cp -v "${neo26[0]}" "${fabric26[0]}" release-assets/
          prop26() { grep -E "^$1=" versions/26.3/gradle.properties | cut -d= -f2- | tr -d '\r'; }
          mkdir -p companions-26.3
          chmod +x .github/scripts/fetch-companion-jars-26.3.sh
          .github/scripts/fetch-companion-jars-26.3.sh \
            companions-26.3 \
            "$(prop26 kff_version)" \
            "$(prop26 fabric_api_version)" \
            "$(prop26 fabric_kotlin_version)" \
            "$(prop26 cloth_config_modrinth_version)" \
            "$(prop26 modmenu_version)" \
            "$(prop26 placeholder_api_version)"
          ls -lh release-assets companions-26.3

      - name: Publish split GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGACY_TAG: v${{ steps.versions.outputs.mod_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          rm -rf release-split
          ver="${{ steps.versions.outputs.mod_version }}"
          stage() {
            local tag="$1"
            local title="$2"
            local body="$3"
            shift 3
            local dir="release-split/${tag}"
            mkdir -p "${dir}"
            printf '%s\n' "${title}" > "${dir}/title.txt"
            printf '%s\n' "${body}" > "${dir}/body.md"
            cp -v "$@" "${dir}/"
          }
          stage minecraft-1.21.1-neoforge \
            "tamed phantoms for minecraft 1.21.1 neoforge" \
            "Minecraft **1.21.1** / NeoForge. The mod jar and Kotlin for Forge are required. Patchouli is optional and only adds the guidebook. \`all-jars.zip\` contains every jar on this page." \
            release-assets/tamedphantoms-neoforge-1.21.1-*.jar \
            release-assets/kotlinforforge-*.jar \
            release-assets/Patchouli-*-NEOFORGE.jar
          stage minecraft-1.21.1-fabric \
            "tamed phantoms for minecraft 1.21.1 fabric" \
            "Minecraft **1.21.1** / Fabric. The mod jar, Fabric API, Fabric Language Kotlin, and Cloth Config are required. Mod Menu and Placeholder API open the config screen. Patchouli is optional. \`all-jars.zip\` contains every jar on this page." \
            release-assets/tamedphantoms-fabric-1.21.1-*.jar \
            release-assets/fabric-api-*.jar \
            release-assets/fabric-language-kotlin-*.jar \
            release-assets/cloth-config-*.jar \
            release-assets/modmenu-*.jar \
            release-assets/placeholder-api-*.jar \
            release-assets/Patchouli-*-FABRIC.jar
          stage minecraft-26.3-neoforge \
            "tamed phantoms for minecraft 26.3 neoforge" \
            "Minecraft **26.3** / NeoForge. The mod jar and Kotlin for Forge 6.4.0 are required. Patchouli has no 26.3 build. \`all-jars.zip\` contains every jar on this page." \
            release-assets/tamedphantoms-neoforge-26.3-*.jar \
            companions-26.3/kotlinforforge-*.jar
          stage minecraft-26.3-fabric \
            "tamed phantoms for minecraft 26.3 fabric" \
            "Minecraft **26.3** / Fabric. The mod jar, Fabric API, Fabric Language Kotlin, and Cloth Config are required. Mod Menu and Placeholder API open the config screen. Patchouli has no 26.3 build. \`all-jars.zip\` contains every jar on this page." \
            release-assets/tamedphantoms-fabric-26.3-*.jar \
            companions-26.3/fabric-api-*.jar \
            companions-26.3/fabric-language-kotlin-*.jar \
            companions-26.3/cloth-config-*.jar \
            companions-26.3/modmenu-*.jar \
            companions-26.3/placeholder-api-*.jar
          python3 .github/scripts/publish-split-releases.py release-split

      - name: Replace Modrinth versions
        id: modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${MODRINTH_TOKEN}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "MODRINTH_TOKEN is empty. Modrinth publish will not replace an existing version."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/replace-modrinth-versions.py \
            tamed-phantoms \
            "${{ steps.versions.outputs.mod_version }}" \
            "${{ steps.versions.outputs.mod_version }}-fabric" \
            "${{ steps.versions.outputs.mod_version }}+26.3" \
            "${{ steps.versions.outputs.mod_version }}+26.3-fabric"

      - name: Publish Modrinth
        if: steps.modrinth.outputs.ready == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: tamed-phantoms
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false
          name: ${{ steps.versions.outputs.mod_version }}
          version: ${{ steps.versions.outputs.mod_version }}
          version-type: release
          changelog: |
            Minecraft 1.21.1 / NeoForge. Tamed Phantoms ${{ steps.versions.outputs.mod_version }}.
          loaders: |
            neoforge
          game-versions: |
            1.21.1
          java: |
            21
          files: release-assets/tamedphantoms-neoforge-1.21.1-${{ steps.versions.outputs.mod_version }}.jar
          dependencies: |
            kotlin-for-forge(required){modrinth:ordsPcFz}
            patchouli(optional){modrinth:nU0bVIaL}

      - name: Publish Modrinth Fabric
        if: steps.modrinth.outputs.ready == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: tamed-phantoms
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false
          name: ${{ steps.versions.outputs.mod_version }} Fabric
          version: ${{ steps.versions.outputs.mod_version }}-fabric
          version-type: release
          changelog: |
            Minecraft 1.21.1 / Fabric. Tamed Phantoms ${{ steps.versions.outputs.mod_version }}.
          loaders: |
            fabric
          game-versions: |
            1.21.1
          java: |
            21
          files: release-assets/tamedphantoms-fabric-1.21.1-${{ steps.versions.outputs.mod_version }}.jar
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
            fabric-language-kotlin(required){modrinth:Ha28R6CL}
            cloth-config(required){modrinth:9s6osm5g}
            modmenu(optional){modrinth:mOgUt4GM}
            placeholder-api(optional){modrinth:eXts2L7r}
            patchouli(optional){modrinth:nU0bVIaL}

      - name: Publish Modrinth 26.3 NeoForge
        if: steps.modrinth.outputs.ready == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: tamed-phantoms
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          name: ${{ steps.versions.outputs.mod_version }} for 26.3
          version: ${{ steps.versions.outputs.mod_version }}+26.3
          version-type: release
          changelog: |
            Minecraft 26.3 / NeoForge. Tamed Phantoms ${{ steps.versions.outputs.mod_version }}.
          loaders: |
            neoforge
          game-versions: |
            26.3
          java: |
            25
          files: release-assets/tamedphantoms-neoforge-26.3-${{ steps.versions.outputs.mod_version }}.jar
          dependencies: |
            kotlin-for-forge(required){modrinth:ordsPcFz}

      - name: Publish Modrinth 26.3 Fabric
        if: steps.modrinth.outputs.ready == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: tamed-phantoms
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false
          name: ${{ steps.versions.outputs.mod_version }} Fabric for 26.3
          version: ${{ steps.versions.outputs.mod_version }}+26.3-fabric
          version-type: release
          changelog: |
            Minecraft 26.3 / Fabric. Tamed Phantoms ${{ steps.versions.outputs.mod_version }}.
          loaders: |
            fabric
          game-versions: |
            26.3
          java: |
            25
          files: release-assets/tamedphantoms-fabric-26.3-${{ steps.versions.outputs.mod_version }}.jar
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
            fabric-language-kotlin(required){modrinth:Ha28R6CL}
            cloth-config(required){modrinth:9s6osm5g}
            modmenu(optional){modrinth:mOgUt4GM}
            placeholder-api(optional){modrinth:eXts2L7r}

      - name: Delete replaced Modrinth versions
        if: steps.modrinth.outputs.ready == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/replace-modrinth-versions.py --finish release-assets/modrinth-delete-after-publish.txt

      - name: Update Modrinth description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${MODRINTH_TOKEN}" ]]; then
            echo "MODRINTH_TOKEN is empty. The Modrinth page will not be updated."
            exit 0
          fi
          python3 .github/scripts/update-modrinth-body.py tamed-phantoms modrinth.md

      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish jars to McnCDN
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          MCNS_WORKER_ID: ${{ secrets.MCNS_WORKER_ID }}
          MCNS_WORKER_KEY: ${{ secrets.MCNS_WORKER_KEY }}
          MCNS_MOD_VERSION: ${{ steps.versions.outputs.mod_version }}
          MCNS_COMMIT: ${{ github.sha }}
          MCNS_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          one() {
            local pattern="$1"
            shopt -s nullglob
            local matches=( $pattern )
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "Expected exactly one file for ${pattern}, found ${#matches[@]}: ${matches[*]}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }
          mod_jar="release-assets/tamedphantoms-neoforge-1.21.1-${{ steps.versions.outputs.mod_version }}.jar"
          kff_jar="$(one 'release-assets/kotlinforforge-*.jar')"
          patchouli_jar="$(one 'release-assets/Patchouli-*-NEOFORGE.jar')"
          node scripts/mcns-release.mjs tamedphantoms-mod auto \
            "mod=${mod_jar}" \
            "kotlinforforge=${kff_jar}" \
            "patchouli=${patchouli_jar}"
          node scripts/mcns-release.mjs tamedphantoms auto \
            "jar=${mod_jar}"
